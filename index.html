<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ホームクイズ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <!-- スタート画面 -->
    <section id="screen-start" class="screen active">
      <h1 id="top-title"></h1>
      <img id="top-image" class="top-image" alt="">
      <p id="top-message"></p>
      <button id="btn-start" class="btn primary">はじめる</button>
    </section>

    <!-- 出題画面 -->
    <section id="screen-question" class="screen">
      <p id="progress" class="progress"></p>
      <h2 id="question-text"></h2>
      <div id="choices" class="choices"></div>
      <p id="feedback" class="feedback"></p>
      <img id="correct-image" class="correct-image" alt="" hidden>
      <p id="explanation" class="explanation" hidden></p>
      <button id="btn-next" class="btn primary" hidden>次へ</button>
    </section>

    <!-- 不正解画面 -->
    <section id="screen-wrong" class="screen">
      <h2 class="wrong-title">ざんねん…</h2>
      <p>もう一度同じ問題に挑戦しよう！</p>
      <button id="btn-retry" class="btn primary">もう一度挑戦</button>
    </section>

    <!-- クリア画面 -->
    <section id="screen-clear" class="screen">
      <h1 class="congrats">Congratulations!</h1>
      <img id="reward-image" class="reward" alt="">
      <p id="reward-message"></p>
      <button id="btn-restart" class="btn">最初から遊ぶ</button>
    </section>
  </main>

  <div id="confetti" class="confetti" aria-hidden="true"></div>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
